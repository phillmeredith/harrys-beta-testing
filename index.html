<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beta Testing">
<meta name="theme-color" content="#2B1F16">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Harry's Beta Testing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: blocky game-menu look. Dirt-tile backdrop (drawn at runtime), stone bevelled buttons, light-grey inventory panels, pixel type. One deliberate dark look in every theme. */
:root{
  --bg:#2B1F16; --ink:#FFFFFF; --muted:#C8C8C8; --shade:#3F3F3F;
  --stone:#7A7A7A; --stone-hi:#ABABAB; --stone-lo:#4A4A4A;
  --panel:#C6C6C6; --panel-hi:#FFFFFF; --panel-lo:#555555; --panel-ink:#3F3F3F;
  --broken:#A8332B; --better:#B8860B; --idea:#2E5FA8; --ok:#3F8E2E; --gold:#FFFF55;
  --line:#000000; --card:#C6C6C6; --bg2:#8B8B8B; --leather:#8A4B2A;
  --pix:"Pixelify Sans","VT323","Courier New",monospace;
  --mono:"VT323","Courier New",monospace;
  --display:var(--pix); --body:var(--pix);
  color-scheme:dark;
}
html,body{height:100%}
body{color:var(--ink);font-family:var(--pix);font-size:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:26px;padding-block:22px 40px}
.txt{text-shadow:3px 3px 0 var(--shade)}

/* stone button: black outline, light top-left bevel, dark bottom-right bevel */
.mcbtn,.tile,.go,.round,.grown{position:relative;font-family:var(--pix);color:#fff;text-shadow:2px 2px 0 var(--shade);cursor:pointer;border:3px solid var(--line);border-radius:0;
  background:var(--stone);box-shadow:inset 3px 3px 0 var(--stone-hi),inset -3px -4px 0 var(--stone-lo)}
.tile:hover,.go:hover,.round:hover,.grown:hover{outline:3px solid #fff;outline-offset:-6px}
.tile:active,.go:active,.round:active{box-shadow:inset 3px 3px 0 var(--stone-lo),inset -3px -3px 0 var(--stone-hi)}
:focus-visible{outline:3px solid var(--gold)!important;outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px}
.round{flex:none;width:60px;height:60px;font-size:28px;display:grid;place-items:center;padding:0}
.round[disabled]{visibility:hidden}
.round.on{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A}
.spacer{flex:1}
.grown{font-size:16px;padding:10px 14px;background:#4E4E4E;box-shadow:inset 2px 2px 0 #777,inset -2px -3px 0 #2A2A2A}

.q{display:flex;align-items:center;gap:12px}
.q h1{font:600 clamp(28px,3.8vw,42px)/1.15 var(--pix);margin:0;text-shadow:3px 3px 0 var(--shade);text-wrap:balance}
.hint{font-size:20px;color:var(--muted);margin:4px 0 0;text-shadow:2px 2px 0 #000}
.say{flex:none;border:none;background:none;font-size:32px;cursor:pointer;padding:6px;color:var(--muted);display:grid}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.grid.big{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 14px;
  font-size:24px;font-weight:600;line-height:1.15;text-align:center;text-wrap:balance}
.tile small{font-size:17px;font-weight:500;color:#E0E0E0}
.tile.sel{outline:4px solid var(--gold);outline-offset:-8px}
.tile.sel::after{content:"";position:absolute;top:8px;right:8px;width:14px;height:14px;background:var(--gold);box-shadow:2px 2px 0 var(--shade)}
.grid.big .tile{min-height:230px;font-size:38px}
.grid.big .tile small{font-size:20px}
.k-broken{background:var(--broken)!important;box-shadow:inset 3px 3px 0 #D4625A,inset -3px -4px 0 #651D18!important}
.k-better{background:var(--better)!important;box-shadow:inset 3px 3px 0 #E2B23D,inset -3px -4px 0 #6E5006!important}
.k-idea{background:var(--idea)!important;box-shadow:inset 3px 3px 0 #5E8BD4,inset -3px -4px 0 #193966!important}
.tile.horse{min-height:140px}
.horse .coin{width:56px;height:56px;display:grid;place-items:center;font:600 28px var(--pix);color:#fff;border:3px solid #000;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -3px 0 rgba(0,0,0,.35);text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.typetile{background:#4E4E4E!important;box-shadow:inset 2px 2px 0 #777,inset -2px -3px 0 #2A2A2A!important}
.row-label{font:600 28px var(--pix);margin:8px 0 -10px;text-shadow:3px 3px 0 var(--shade)}

.go{align-self:center;font-size:28px;font-weight:600;padding:16px 46px;min-width:240px}
.go[disabled]{opacity:.45;cursor:default;outline:none}
.go.quiet{background:#4E4E4E;box-shadow:inset 3px 3px 0 #777,inset -3px -4px 0 #2A2A2A}
.go.small{font-size:20px;padding:10px 20px;min-width:0}
.go#send,.go#later,.go#namedone,.go#again,.go#next{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A}

/* inventory panel */
.panel,.story,.editor,.namebox{background:var(--panel);color:var(--panel-ink);border:3px solid var(--line);border-radius:0;text-shadow:none;
  box-shadow:inset 4px 4px 0 var(--panel-hi),inset -4px -4px 0 var(--panel-lo)}
.panel{padding:28px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;min-width:0}
.panel h2{font:600 28px var(--pix);margin:0}
.extras{display:grid;grid-template-columns:minmax(0,560px);justify-content:center;gap:20px}
.slot{width:100%;max-width:420px;aspect-ratio:4/3;background:#8B8B8B;border:0;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff;display:grid;place-items:center;overflow:hidden;position:relative}
.slot img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.slot .empty{color:#3F3F3F;font-size:20px;padding:20px}
.slot .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:15px;padding:3px 8px}
.filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.namebox{padding:30px;display:flex;flex-direction:column;gap:20px;align-items:center;max-width:720px;width:100%;align-self:center;box-sizing:border-box}
.namebox label{font:600 30px var(--pix)}
.namebox input,#msg{background:#000;color:#fff;border:3px solid #A0A0A0;border-radius:0;user-select:text;-webkit-user-select:text;box-sizing:border-box}
.namebox input{width:100%;font:500 40px var(--pix);text-align:center;padding:14px 18px}
.namebox input:focus,#msg:focus{outline:none;border-color:#fff}
.namebox .note{color:var(--panel-ink)}

.story{padding:26px 30px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.story p{font:600 clamp(26px,3vw,34px)/1.25 var(--pix);margin:0;text-wrap:balance}
.kindtag{color:#fff;padding:4px 12px;font:600 17px var(--pix);border:2px solid #000;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:-10px}
.chip{background:#000;color:var(--gold);border:2px solid #555;padding:6px 14px;font-size:17px}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btns.left{justify-content:flex-start}

.editor{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.editor .row-label{color:var(--panel-ink);text-shadow:none}
.editor .hint{color:#555;text-shadow:none}
.edhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.status{font-size:17px;color:#24561A}
#msg{width:100%;min-height:220px;resize:vertical;font:21px/1.3 var(--mono);padding:14px 16px;overflow:hidden}
.hist summary{font:600 22px var(--pix);cursor:pointer;padding:6px 0}
.hist ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#8B8B8B;color:#fff;text-shadow:2px 2px 0 #3F3F3F;padding:10px 14px;min-width:0;
  box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff}
.hist li > div{min-width:0}
.hist li.now{outline:3px solid #24561A;outline-offset:-3px}
.hist .when,.hist .what{color:#EDEDED;font-size:17px;word-break:break-word}
.pill{flex:none;background:var(--ok);color:#fff;border:2px solid #000;padding:3px 10px;font-size:15px}
.tile.resume{min-height:120px;gap:8px}
.tile.resume .kindtag{font-size:14px}

/* title-screen panorama behind every screen; darker away from the title screen */
#pano{position:fixed;inset:-40px;z-index:-1;background-repeat:no-repeat;background-size:cover;background-position:50% 45%;filter:blur(6px) brightness(.6) saturate(1.05);animation:drift 60s ease-in-out infinite alternate}
body.home #pano{filter:blur(3.5px) brightness(.82) saturate(1.1)}
@keyframes drift{from{transform:scale(1.05) translate(-1.5%,-1%)}to{transform:scale(1.15) translate(1.5%,1%)}}
body{background:#4E7A35}
.title-screen{min-height:calc(100vh - 62px);display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;padding-top:24px}
.corner{position:absolute;top:0;right:0}
.logo{position:relative;text-align:center;margin-top:clamp(28px,9vh,110px)}
.logo .l1,.logo .l2{font-family:"Silkscreen",var(--pix);font-weight:700;color:#D8D8D8;line-height:.95;letter-spacing:.02em;
  text-shadow:0 2px 0 #A0A0A0,0 4px 0 #8A8A8A,0 6px 0 #6E6E6E,0 8px 0 #555,0 10px 0 #3A3A3A,0 12px 0 #222,
    -3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 14px 0 #000,-3px 12px 0 #000,3px 12px 0 #000}
.logo .l1{font-size:clamp(30px,4.5vw,52px)}
.logo .l2{font-size:clamp(40px,8vw,96px);text-transform:uppercase}
.splash{position:absolute;right:-6%;bottom:-6px;color:#FFFF00;font:600 clamp(18px,2.4vw,28px) var(--pix);text-shadow:3px 3px 0 #3F3F00;transform:rotate(-17deg);white-space:nowrap;animation:splash .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes splash{from{transform:rotate(-17deg) scale(.94)}to{transform:rotate(-17deg) scale(1.06)}}
.today{max-width:520px;text-align:center;font-size:19px;line-height:1.35;color:#fff;background:rgba(0,0,0,.55);border:2px solid #000;padding:12px 16px;text-shadow:2px 2px 0 #000}
.ask{font-size:clamp(20px,2.4vw,26px);color:#fff;text-shadow:2px 2px 0 #000;text-align:center;margin-top:auto}
.menu{width:min(520px,100%);display:flex;flex-direction:column;gap:12px;margin-top:auto}
.tile.mm{min-height:62px;padding:10px 16px;font-size:26px;width:100%;flex-direction:row}
.tile.mm.primary{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A}
.tile.mm[disabled]{opacity:.5;cursor:default;outline:none}
.menu-row{display:flex;gap:12px}
.tile.mm.half{font-size:20px}
.savedlist{display:flex;flex-direction:column;gap:8px}
.tile.mm.resume{font-size:19px;justify-content:flex-start;gap:10px;min-height:52px}
.tile.mm.resume small{margin-left:auto}
.foot{margin-top:4px;width:100%;display:flex;justify-content:space-between;gap:12px;font-size:17px;color:#fff;text-shadow:2px 2px 0 #000;padding-top:30px}
@media (max-width:640px){ .splash{right:4px;bottom:-22px} .title-screen{padding-top:56px} .tile.mm{font-size:22px} .menu-row{flex-direction:column} }
@media (prefers-reduced-motion:reduce){#pano,.splash{animation:none!important}}
/* universal picker */
.trail{font-size:18px;color:#fff;text-shadow:2px 2px 0 #000;margin:-14px 0 -8px;opacity:.9}
.partno{font:600 18px var(--pix);color:var(--gold);text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.45);padding:6px 12px;border:2px solid #000}
.soFar{background:var(--panel);color:var(--panel-ink);border:3px solid #000;box-shadow:inset 4px 4px 0 var(--panel-hi),inset -4px -4px 0 var(--panel-lo);padding:18px 22px}
.soFar span{font:600 18px var(--pix);color:#555}
.soFar p{font:600 26px/1.3 var(--pix);margin:6px 0 0}
.grid.big2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.big2 .tile{min-height:170px;font-size:32px}
.tile.folder{background:#5E5E5E;box-shadow:inset 3px 3px 0 #8E8E8E,inset -3px -4px 0 #383838}
.tile.folder::before{content:"";position:absolute;right:10px;bottom:10px;border:7px solid transparent;border-left:9px solid #fff;filter:drop-shadow(2px 2px 0 #000)}
.tile.primary{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A}
.tile[disabled]{opacity:.4;cursor:default;outline:none}
/* number builder */
.numbox{gap:12px;padding:22px}
.bignum{font:700 clamp(64px,9vw,104px)/1 "Silkscreen",var(--pix);color:#3F3F3F}
.sumline{font:600 30px var(--mono);color:#24561A;min-height:32px}
.numwhat{font:600 22px var(--pix);margin:0}
.numsay{font:600 20px var(--pix);margin:0;color:#3F3F3F}
.blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;max-width:100%}
.blocks i{display:inline-block;width:16px;height:16px;background:#8B5A2B;border:2px solid #000;box-shadow:inset 2px 2px 0 #C08550,inset -2px -2px 0 #4F3016}
.blocks i.half{width:8px}
.stack{width:52px;height:52px;display:grid;place-items:center;background:#8B5A2B;border:3px solid #000;box-shadow:inset 3px 3px 0 #C08550,inset -3px -3px 0 #4F3016;color:#fff;font:600 18px var(--pix);text-shadow:2px 2px 0 #000}
.eights{display:flex;flex-direction:column;gap:3px}.row8{display:flex;gap:3px}
.coinbag{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#D4A017;border:3px solid #000;color:#fff;font:600 16px var(--pix);text-shadow:2px 2px 0 #000}
.c1{display:inline-block;width:20px;height:20px;border-radius:50%;background:#E8C547;border:2px solid #000}
.c1.half{width:10px;border-radius:10px 0 0 10px}
.stackmore{font:600 18px var(--pix);color:#3F3F3F}
.timesrow .one{font:600 18px var(--pix);width:26px;height:26px;display:grid;place-items:center;background:#7A7A7A;color:#fff;border:2px solid #000}
.timesrow .arrow{font-size:22px;color:#3F3F3F}
.grid.ops{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.ops .tile{min-height:76px;font-size:22px}
/* puzzle + stats */
.puz{max-width:760px;width:100%;align-self:center;box-sizing:border-box}
.puzq{font:600 26px/1.3 var(--pix);margin:0}
.grid.puzopts{width:100%;grid-template-columns:repeat(3,1fr)}
.tile.mm.right{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A;opacity:1}
.puzopts .tile[disabled]{opacity:1}
.done .puz p,.puz h2{color:var(--panel-ink);text-shadow:none;max-width:none}
.go#numdone{background:var(--ok);box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -4px 0 #24561A}
.puzres{font:600 24px var(--pix);margin:0;color:#24561A}
.stats{background:rgba(0,0,0,.55);border:2px solid #000;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;font-size:17px;text-shadow:2px 2px 0 #000}
.slab{width:150px}.sbar{display:flex;gap:3px;flex:1}.sbar i{width:14px;height:14px;border:2px solid #000}
.fixtag{background:var(--ok);color:#fff;border:2px solid #000;padding:2px 8px;font-size:14px;margin-left:8px}
.fixtag.wip{background:var(--better)}
.relnotes{margin:0;padding-left:22px;font-size:19px;text-shadow:2px 2px 0 #000}
.relhow{margin:0;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000}
.relpanel .tile{box-sizing:border-box}
.tile.mm.latestver{font-size:20px;min-height:52px}
.tile.mm.newver{background:#B8860B;box-shadow:inset 3px 3px 0 #E2B23D,inset -3px -4px 0 #6E5006}
.relpanel{background:rgba(0,0,0,.55);border:2px solid #000;padding:12px}
/* home screen: exactly one screen, never scrolls; lists open as overlays */
html:has(body.home),body.home{height:100%;overflow:hidden;overscroll-behavior:none}
body.home{padding-top:0!important}
body.home .app{height:100dvh;min-height:0;box-sizing:border-box;overflow:hidden;padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));gap:0}
body.home .title-screen{height:100%;min-height:0;padding-top:0;gap:clamp(8px,2dvh,22px)}
body.home .logo{margin-top:clamp(6px,7dvh,110px)}
body.home .foot{padding-top:0}
.homeover{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.homeover .inner{width:min(560px,100%);max-height:84dvh;overflow:auto;box-sizing:border-box;background:#2B2B2B;border:3px solid #000;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.tile.mm.closeover{background:#4E4E4E;box-shadow:inset 3px 3px 0 #777,inset -3px -4px 0 #2A2A2A;flex:none}
body.home .logo .l1{font-size:min(4.5vw,6dvh,52px)}
body.home .logo .l2{font-size:min(8vw,11dvh,96px)}
body.home .tile.mm{min-height:clamp(44px,7.4dvh,62px);padding-block:6px}
body.home .menu{gap:clamp(6px,1.4dvh,12px)}
body.home .ask{font-size:min(2.4vw,3.2dvh,26px)}
body.home .today{font-size:min(17px,2.4dvh);padding:6px 12px}
body.home .foot{font-size:min(17px,2.2dvh)}
@media (max-height:700px){ body.home .logo .l2{font-size:clamp(34px,6vw,72px)} body.home .tile.mm{min-height:50px;font-size:22px} body.home .today{font-size:16px;padding:8px 12px} }
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--pix);color:#fff;background:var(--stone);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--stone-hi),inset -3px -4px 0 var(--stone-lo);padding:10px 12px;cursor:pointer;text-shadow:2px 2px 0 var(--shade)}
.rkind{flex:none;width:18px;align-self:stretch;border:2px solid #000}
.rwhat{flex:1;min-width:0;display:flex;flex-direction:column}
.rwhat b{font-size:21px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwhat small{font-size:15px;color:#E0E0E0}
.rstate{flex:none;font-size:16px;padding:6px 10px;border:2px solid #000;max-width:45%;text-align:center}
.st-draft{background:#4E4E4E}.st-sent{background:var(--idea)}.st-wip{background:var(--better)}.st-fixed{background:var(--ok)}
.q h1,.logo{-webkit-touch-callout:none}
@media (max-height:480px){ body.home .ask,body.home .logo .l1{display:none} body.home .tile.mm{min-height:38px;font-size:18px} }
/* iOS share sheet and Messages stay iOS-looking: they are the iPad's own screens */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;font-family:-apple-system,system-ui,sans-serif;text-shadow:none}
.sheet{width:min(560px,100%);background:#F2F2F7;color:#111;border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#C7C7CC;align-self:center}
.sheet .prev{display:flex;gap:12px;align-items:center;font-size:15px;color:#6B6B70;border-bottom:1px solid #D1D1D6;padding-bottom:12px}
.sheet .prev b{color:#111;display:block;font-size:16px}
.sheet .prev img{width:56px;height:42px;object-fit:cover;border-radius:6px}
.people,.apps{display:flex;gap:18px;overflow-x:auto}
.person,.appi{display:flex;flex-direction:column;align-items:center;gap:6px;font:13px -apple-system,system-ui,sans-serif;background:none;border:none;color:#111;cursor:pointer;min-width:72px}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:600 24px -apple-system,system-ui,sans-serif;color:#fff;background:#8E9AA6}
.ai{width:60px;height:60px;border-radius:14px}
.imsg{width:min(620px,100%);height:min(86vh,720px);background:#fff;color:#111;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;align-self:center}
.imsg header{padding:14px;text-align:center;border-bottom:1px solid #E5E5EA;font-weight:600}
.imsg .body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.imsg .photo{align-self:flex-end;max-width:60%;border-radius:18px;display:block}
.bubble{align-self:flex-end;max-width:88%;background:#1A84FF;color:#fff;border-radius:20px 20px 4px 20px;padding:12px 14px;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.imsg footer{display:flex;gap:10px;padding:12px;border-top:1px solid #E5E5EA;align-items:center}
.imsg footer span{flex:1;color:#8E8E93;font-size:14px}
.sendb{width:52px;height:52px;border-radius:50%;border:none;background:#1A84FF;color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center}
.note{font-size:15px;color:var(--muted);text-align:center}
.sheet .note{color:#6B6B70}

/* done: game-style "toast" */
.done{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding-top:30px}
.toast{background:#212121;border:3px solid #000;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #111;padding:20px 28px;display:flex;gap:18px;align-items:center;text-align:left;max-width:560px}
.toast .ic{flex:none;width:72px;height:72px;background:var(--ok);border:3px solid #000;box-shadow:inset 3px 3px 0 #6FC25A,inset -3px -3px 0 #24561A;display:grid;place-items:center;font-size:40px;color:#fff}
.toast b{display:block;color:var(--gold);font-size:22px;text-shadow:2px 2px 0 #3F3F15}
.toast span{font-size:26px;text-shadow:2px 2px 0 #000}
.done p{font-size:22px;color:var(--muted);margin:0;max-width:34ch;text-shadow:2px 2px 0 #000}

/* grown-up drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);color:var(--panel-ink);border-left:3px solid #000;z-index:30;text-shadow:none;
  display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;gap:12px;box-shadow:inset 4px 0 0 #fff}
.drawer h3{margin:0;font:600 24px var(--pix);display:flex;justify-content:space-between;align-items:center}
.drawer p{margin:0;font-size:17px;color:#555;line-height:1.3}
.drawer pre{flex:1;overflow:auto;margin:0;background:#000;color:#fff;border:3px solid #A0A0A0;padding:14px;font:19px/1.3 var(--mono);white-space:pre-wrap;user-select:text;-webkit-user-select:text;min-width:0}
.drawer .x{border:none;background:none;font-size:26px;cursor:pointer;color:var(--panel-ink);display:grid}
.copy{font:600 20px var(--pix);padding:10px;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #3F3F3F;border:3px solid #000;background:var(--stone);box-shadow:inset 3px 3px 0 var(--stone-hi),inset -3px -4px 0 var(--stone-lo)}

@media (max-width:640px){
  body{font-size:17px}
  .app{gap:18px;padding-block:14px 28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{min-height:92px;font-size:20px;padding:14px 8px}
  .tile.horse{min-height:116px}
  .grid.big{grid-template-columns:1fr}
  .grid.big .tile{min-height:120px;font-size:30px}
  .round{width:50px;height:50px;font-size:22px}
  .grown{padding:6px 10px;font-size:13px}
  .go{min-width:0;font-size:24px;padding:14px 30px}
  .story,.editor,.namebox{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Grouping: never more than 8 tiles on a screen ---------- */
const isLeaf = n => !n.k;
function chunk(arr){
  if (arr.length <= 2*PER+1) return arr; // short lists just page with "More"
  const per = Math.pow(PER, Math.ceil(Math.log(arr.length)/Math.log(PER)) - 1);
  const out = [];
  for (let i=0;i<arr.length;i+=per){ const s=arr.slice(i,i+per); out.push(s.length===1 ? s[0] : {l:`${s[0].l} to ${s[s.length-1].l}`, sub:`${s.length} to pick from`, k:s, chunk:true, tp:s[0].tp}); }
  return out.length > PER ? chunk(out) : out;
}
function shown(node){ // children to show for a node (or the root list), grouped and with "Something else"
  const kids = node.k;
  const list = kids.every(isLeaf) ? chunk(kids) : kids;
  return list;
}

function persist(){
  if(!S.kind) return true;
  const all=loadAll(); all[S.id]={...S, typing:false, puz:null, updated:Date.now()};
  if (saveAll(all)) { saveWarn=false; return true; }
  all[S.id].shot=false; saveWarn = saveAll(all) ? "picture" : "all"; return false;
}
function addVersion(kind){
  const last = S.versions[S.versions.length-1];
  if (last && last.text === S.text && kind==="auto") return false;
  S.versions.push({t:Date.now(), kind, text:S.text}); persist(); return true;
}
function diffNote(a,b){
  if (a==null) return "First version";
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++;
  const cut = x => { x=x.replace(/\s+/g," ").trim(); return x.length>48 ? x.slice(0,46)+"…" : x; };
  const rem = cut(a.slice(i,a.length-j)), add = cut(b.slice(i,b.length-j));
  if (!rem && !add) return "No change";
  if (rem && add) return `Changed “${rem}” to “${add}”`;
  return add ? `Added “${add}”` : `Took out “${rem}”`;
}

/* ---------- Steps ---------- */
function steps(){
  const s = ["kind","thing"];
  if (S.kind === "broken"){ s.push("what","doing","holding","tapped","words","often"); if (!installedVersion()) s.push("version"); }
  else {
    if (S.thing?.isNew) s.push("like","where");
    s.push("change");
    if (S.change && S.change.dt && S.change.dt !== "none") s.push("detail");
    s.push("when","onlyif","more");
  }
  s.push("extras","review");
  return s;
}
const cur = () => S.step === "done" ? "done" : steps()[S.step];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORDER = ["kind","thing","like","where","change","detail","what","doing","holding","tapped","words","often","version","when","onlyif","shot"];
function clearAfter(key){
  ORDER.slice(ORDER.indexOf(key)+1).forEach(k=>{ S[k] = k==="shot" ? false : null; });
  if (key==="kind") S.parts = [];
  S.pk = {path:[],page:0}; S.likeMode=null; S.typing=false; S.amtWords=false; S.num=null; S.numLog=null;
}

// Which tree each picker step walks
function pickerRoot(st){
  if (st==="thing") return {k: ROOT(S.kind==="idea", false)};
  if (st==="holding") return {k: HOLD_TREE()};
  if (st==="like") return {k: S.likeMode==="mod" ? MOD_TREE : fromObj(MC_TREE,"mc:","other")};
  if (st==="change") return {k: CHANGES};
  if (st==="detail"){
    const c = S.change;
    if (c.dt==="colour") return {k: leaves(COLOURS,"colour:","other")};
    if (c.dt==="amount") return {k: leaves(AMOUNTS,"amount:","other")};
    if (c.dt==="list") return {k: leaves(c.opts,"opt:","other")};
    if (c.dt==="thing") return {k: ROOT(false, true)};
  }
}
function pickerList(st){
  let node = pickerRoot(st), trail = [];
  for (const i of S.pk.path){ const list = shown(node); node = list[i]; if (!node) break; if (!node.chunk) trail.push(node.l); }
  return {node, list: shown(node), trail};
}
function pagedTiles(list){
  const page = S.pk.page||0;
  if (list.length <= 8) return {items: list.map((n,i)=>[n,i]), more:false};
  const start = page*PER, items = list.slice(start, start+PER).map((n,i)=>[n,start+i]);
  return {items, more: start+PER < list.length, page};
}

}

    } else {
      const {list, trail} = pickerList(st), pg = pagedTiles(list), chosen = S[st==="like"?"like":st];
      body = (trail.length?`<div class="trail">${trail.map(esc).join(" › ")}</div>`:"") +
        `<div class="grid">${pg.items.map(([n,i])=>tile({v:"i"+i, label:n.l, sub:n.sub || (n.k && !n.chunk ? `${countLeaves(n)} to pick from` : ""), coin:n.coin, cls:(n.coin?"horse":"")+(n.k?" folder":""), sel: chosen && !n.k && chosen.l===n.l && chosen.id===n.id})).join("")}
         ${pg.more?tile({v:"__more",label:"More",sub:"See the next page",cls:"folder"}):""}</div>`;
    }
  } else if (st === "like"){
    q = QUESTIONS.like();
    body = `<div class="grid">${tile({v:"lk:mod",label:"Like something in my mod"})}${tile({v:"lk:mc",label:"Like something in Minecraft"})}${tile({v:"lk:none",label:"No, it's totally new",sel:S.like===null&&S.likeMode===false})}</div>`;
  } else if (st === "what"){
    q = S.thing?.vague ? "What happened?" : `What happened to ${S.thing?.l}?`;
    const ok = BROKEN_FOR[S.thing?.tp] || BROKEN_FOR.other;
    body = `<div class="grid">${BROKEN.filter(w=>ok.includes(w.id)).map(w=>tile({v:w.id,label:w.label,sel:S.what===w.id})).join("")}</div>`;
  } else if (st === "tapped"){
    q = "What did you do just before it happened?";
    body = `<div class="grid">${TAPPED.map(l=>tile({v:l,label:l,sel:S.tapped===l})).join("")}</div>`;
  } else if (st === "words"){
    q = "Did any words come up on the screen?";
    body = `<div class="grid big">${WORDS.map(l=>tile({v:l,label:l,sel:S.words===l})).join("")}</div>`;
  } else if (st === "version"){
    q = "Which version does your Horse Guide say?";
    const vs = (REL?.releases||[]).map(r=>r.version).slice(0,6); if (!vs.length) vs.push(VERSION);
    body = `<p class="hint" style="margin-top:-18px">It's on the front page of the Horse Guide.</p><div class="grid">${vs.map(v=>tile({v:"ver:"+v,label:v,sel:S.version===v})).join("")}${tile({v:"ver:?",label:"Don't know",sel:S.version==="?"})}</div>`;
  } else if (st === "where"){
    q = `Where would you find ${subj()}?`;
    body = `<div class="grid">${WHERE_NEW.map(l=>tile({v:l,label:l,sel:S.where===l})).join("")}</div><button class="go quiet" id="next">Skip</button>`;
  } else if (st === "doing"){
    q = "What were you doing?";
    body = `<div class="grid">${DOING.map(l=>tile({v:l,label:l,sel:S.doing===l})).join("")}</div>`;
  } else if (st === "often"){
    q = "Did it happen more than once?";
    body = `<div class="grid">${OFTEN.map(l=>tile({v:l,label:l,sel:S.often===l})).join("")}</div><button class="go quiet" id="next">Skip</button>`;
  } else if (st === "when"){
    q = "When should it happen?";
    body = `<div class="grid">${WHEN.slice(0,8).map(l=>tile({v:l,label:l,sel:S.when===l})).join("")}</div>
      <div class="grid">${WHEN.slice(8).map(l=>tile({v:l,label:l,sel:S.when===l})).join("")}</div><button class="go quiet" id="next">Skip</button>`;
  } else if (st === "onlyif"){
    q = "Only sometimes?";
    body = `<div class="grid">${ONLYIF.slice(0,8).map(l=>tile({v:l,label:l,sel:S.onlyif===l})).join("")}</div>
      <div class="grid">${ONLYIF.slice(8).map(l=>tile({v:l,label:l,sel:S.onlyif===l})).join("")}</div><button class="go quiet" id="next">Skip, it's always</button>`;
  } else if (st === "more"){
    q = "Anything else for this idea?";
    body = `<div class="soFar"><span>So far</span><p>${esc(sentence())}</p></div>
      <div class="grid big2">${tile({v:"more:add",label:"Add another part",sub:"Something else should happen too"})}${tile({v:"more:done",label:"That's everything",sub:"Go to the picture and check",cls:"primary"})}</div>`;
  } else if (st === "extras"){
    q = S.words==="Yes, words came up" ? "Can you show Daddy the words?" : "Want to show Daddy a picture?";
    body = `<p class="hint" style="margin-top:-18px">${S.words==="Yes, words came up"?"A screenshot of the words helps Daddy most. You can skip this.":"You can skip this."}</p><div class="extras">
      <div class="panel"><h2>Add a picture</h2>
        <div class="slot">${S.shot?`<img src="${S.shot}" alt="Harry's picture"><span class="tag">Picture added</span>`:`<span class="empty">No picture yet</span>`}</div>
        <input type="file" accept="image/*" id="pickfile" class="filepick">
        <div class="btns">${S.shot?`<button class="go quiet small" id="shotoff">Take it away</button><button class="go small" id="shoton">Pick a different one</button>`:`<button class="go small" id="shoton">Pick a screenshot</button>`}</div>
        <p class="note" style="color:var(--panel-ink);margin:0">To take one in the game, press the top button and volume up together.</p>
      </div></div><button class="go" id="next">${S.shot?"Next":"Skip"}</button>`;
  } else if (st === "review"){
    q = "Is this right?";
    enterReview();
    body = `<div class="chips"><span class="kindtag k-${S.kind}">${esc(KINDS[S.kind].label)}</span>${S.parts.length?`<span class="chip">${S.parts.length+1} parts</span>`:""}${S.shot?'<span class="chip">Picture</span>':""}<span class="chip">Report ${code()}</span></div>
      <section class="editor">
        <div class="edhead"><label for="msg" class="row-label" style="margin:0">What you want to tell Daddy</label><span class="status" id="status">${statusText()}</span></div>
        <p class="hint" style="margin:0">These are your words. Tap them to change or add anything.${S.kind==="broken"&&S.words==="Yes, words came up"&&!S.shot?" If you remember the words on the screen, add them here.":""}</p>
        <textarea id="msg" spellcheck="true" autocapitalize="sentences">${esc(S.text)}</textarea>
        <div class="btns left"><button class="go quiet small" id="save">Save</button><button class="go quiet small" id="undoall" ${S.text===S.base?"disabled":""}>Undo all my changes</button></div>
        <details class="hist" ${S.histOpen?"open":""} id="hist"><summary>My changes (<span id="vcount">${S.versions.length}</span>)</summary><ol id="vlist">${historyHTML()}</ol></details>
      </section>
      ${S.kind==="broken"?`<div class="laura"><span>Were you playing with Laura?</span><div class="btns"><button class="tile mm yn ${S.laura?"sel":""}" id="laurayes">Yes</button><button class="tile mm yn ${S.laura?"":"sel"}" id="laurano">No</button></div></div>`:""}
      <div class="btns"><button class="go quiet" id="fix">Change my taps</button>${sentToday() && !S.sent ? `<button class="go" id="later">Save it for tomorrow</button></div><p class="hint" style="text-align:center;margin:0">You've already sent one today. This one will be in "Not sent yet" for tomorrow.</p>` : `<button class="go" id="send">Send to Daddy</button></div>`}`;
  } else if (st === "done"){
    app.innerHTML = head + `<div class="done"><div class="toast"><div class="ic">✓</div><div><b>Report sent!</b><span>Thank you, Harry</span></div></div>
      <p>Daddy has your message. Claude will start fixing it.</p>
      ${puzzleHTML()}
      <button class="go" id="again">Tell Daddy something else</button>
      <button class="go quiet small" id="resend">Didn't go to Daddy? Send it again</button></div>`;
    wire(); return;
  }
  app.innerHTML = head + `<div class="q"><div><h1>${esc(q)}</h1></div></div>` + body;
  wire();
  if (drawer) openDrawer();
}
function countLeaves(n){ return n.k ? n.k.reduce((a,c)=>a+countLeaves(c),0) : 1; }
function statusText(){
  if (saveWarn==="picture") return "Words saved. The picture was too big to keep.";
  if (saveWarn==="all") return "Couldn't save. Send it now so it isn't lost.";
  return S.versions.length>1 ? `Saved ${clock(S.versions[S.versions.length-1].t)}` : "Saves by itself as you change it";
}

/* ---------- Words ---------- */
function partSentence(p){
  if (!p.change) return "";
  let s = `${cap(subj(p))}${p.where?` (${lc(p.where)})`:""}: ${lc(p.change.l)}`;
  if (p.detail?.num) s = `${cap(subj(p))}${p.where?` (${lc(p.where)})`:""}: ${p.detail.l}`;
  else if (p.detail) s += ` (${lc(p.detail.l)})`;
  if (p.when && p.when!=="All the time") s += `, ${lc(p.when)}`;
  if (p.onlyif) s += `, ${lc(p.onlyif)}`;
  return s + ".";
}
function sentence(){
  if (S.kind==="broken"){
    const w = brokenObj(); if (!w) return "";
    let s = S.thing?.vague ? `Something went wrong: ${lc(w.label)}` : `${S.thing?.l}: ${lc(w.label)}`;
    if (S.doing && S.doing!=="Don't know") s += ` when I was ${lc(S.doing).replace("in the horse guide","in the Horse Guide")}`;
    if (S.holding && !S.holding.vague) s += S.holding.id==="hand:empty" ? " with nothing in my hand" : ` holding ${S.holding.l}`;
    if (S.tapped && S.tapped!=="Don't know") s += `. Just before, I ${lc(S.tapped).replace(/^tapped/,"tapped").replace(/^just walking or riding/,"was just walking or riding").replace(/^got on or off/,"got on or off")}`;
    if (S.words==="Yes, words came up") s += ". Some words came up on the screen";
    s += "."; if (S.often) s += ` ${S.often}.`; return s;
  }
  const parts = [...S.parts, S].map(partSentence).filter(Boolean);
  const pre = S.kind==="better" ? "Make it better. " : "New idea! ";
  return pre + parts.join(" And: ");
}
const trailOf = t => t ? `${t.l}${t.id?` (id ${t.id})`:""}${t.trail?` [${t.trail.join(" › ")}]`:""}` : "…";
function prompt(){
  if (!S.kind) return "(Harry hasn't picked anything yet.)";
  const when = S.sent || Date.now(), d = new Date(when), L = [];
  L.push(`[Harry's Beta Testing] ${KINDS[S.kind].word} · report ${code()}`);
  L.push(`Harry said: "${(S.text ?? sentence()) || "…"}"`, "");
  L.push(`Add-on: Harry's Equestrian ${versionText()} · iPad Pro · ${S.laura?"LAN game with Laura":"single player"}`);
  L.push(`Sent: ${d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}, ${d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`);
  if (S.kind==="broken"){
    const w = brokenObj();
    L.push(`About: ${trailOf(S.thing)}`);
    if (w) L.push(`What happened: ${w.label} (${w.id})`);
    if (S.doing) L.push(`Harry was: ${S.doing}`);
    if (S.holding) L.push(`In his hand: ${S.holding.id==="hand:empty"?"nothing":trailOf(S.holding)}`);
    if (S.tapped) L.push(`Just before: ${S.tapped}`);
    if (S.words) L.push(`Words on screen: ${S.words}${S.words==="Yes, words came up" ? (S.shot?" (see screenshot)":" (no screenshot; check Harry's sentence, otherwise ask)") : ""}`);
    if (S.often) L.push(`How often: ${S.often}`);
    if (w){ L.push("", "Steps (from Harry's taps):",
      `1. ${S.laura?"In a LAN game with Laura, ":""}${S.laura ? (S.doing && S.doing!=="Don't know" ? S.doing.toLowerCase() : "playing normally") : (S.doing && S.doing!=="Don't know" ? S.doing : "Playing normally")}${S.thing && !S.thing.vague?` with ${S.thing.l}`:""}${S.holding && S.holding.id!=="hand:empty" && !S.holding.vague ? `, holding ${S.holding.l}`:""}`,
      `2. ${S.tapped && S.tapped!=="Don't know" ? S.tapped : "(what he did just before is unknown)"}`,
      `3. ${S.thing?.l||"It"}: ${w.act}`, `Expected: ${w.exp}.`, `Actual: ${w.act}.`); }
  } else {
    [...S.parts, S].forEach((p,i)=>{
      if (!p.thing) return;
      L.push("", `Part ${i+1}`);
      L.push(`  thing:   ${trailOf(p.thing)}${p.thing.isNew?" (brand new)":""}`);
      if (p.like) L.push(`  like:    ${trailOf(p.like)}`);
      if (p.change) L.push(`  change:  ${p.change.l} (${p.change.id})${p.change.cat?` [${p.change.cat}]`:""}`);
      if (p.detail) L.push(`  detail:  ${trailOf(p.detail)}`);
      if (p.when) L.push(`  when:    ${p.when}`);
      if (p.onlyif) L.push(`  only if: ${p.onlyif}`);
    });
  }
  const bn = builderNotes(); if (bn.length) L.push("", "For the builder:", ...bn.map(x=>"- "+x));
  L.push(S.shot ? `Screenshot: 1 attached to this message (report ${code()}). If it's missing, ask Phill for it.` : "Screenshot: none", "");
  if (S.kind==="broken") L.push("Please reproduce this on the test server, check it against expected_behaviour.md, fix it in the next .mcaddon and add a check to the per-item test.");
  else if (S.kind==="better") L.push("Please suggest how to make this change (tap-only, no fail states), say what it would take, and add it to the feature plan.");
  else L.push("Please turn this into a feature idea for the plan (tap-only, no fail states), say what it would take, and ask Phill before building it.");
  return L.join("\n");
}

/* ---------- Taps ---------- */
function advance(){ S.step++; S.pk={path:[],page:0}; persist(); render(); }
function pick(v){
  const st = cur();
  if (st==="kind"){ if(S.kind!==v) clearAfter("kind"); S.kind=v; return advance(); }
  if (["thing","change","detail","holding","like"].includes(st) && (st!=="like" || S.likeMode)){
    if (v==="__more"){ S.pk.page=(S.pk.page||0)+1; return render(); }
    const {list, trail} = pickerList(st), n = list[+v.slice(1)];
    if (n.k){ S.pk.path.push(+v.slice(1)); S.pk.page=0; return render(); }
    if (n.typed){ S.typing=true; render(); setTimeout(()=>document.getElementById("hname")?.focus(),50); return; }
    const key = st;
    const val = {...n, trail}; delete val.k;
    if (st==="change") val.cat = trail[0];
    if (JSON.stringify(S[key])!==JSON.stringify(val)) clearAfter(key);
    S[key] = val; return advance();
  }
  if (st==="like"){
    if (v==="lk:none"){ if(S.like) clearAfter("like"); S.like=null; S.likeMode=false; return advance(); }
    S.likeMode = v==="lk:mod" ? "mod" : "mc"; S.pk={path:[],page:0}; return render();
  }
  if (st==="what"){ if(S.what!==v) clearAfter("what"); S.what=v; return advance(); }
  if (st==="doing"){ if(S.doing!==v) clearAfter("doing"); S.doing=v; return advance(); }
  if (st==="tapped"){ if(S.tapped!==v) clearAfter("tapped"); S.tapped=v; return advance(); }
  if (st==="words"){ if(S.words!==v) clearAfter("words"); S.words=v; return advance(); }
  if (st==="version"){ S.version=v.slice(4); return advance(); }
  if (st==="where"){ if(S.where!==v) clearAfter("where"); S.where=v; return advance(); }
  if (st==="often"){ S.often=v; return advance(); }
  if (st==="when"){ if(S.when!==v) clearAfter("when"); S.when=v; return advance(); }
  if (st==="onlyif"){ S.onlyif=v; return advance(); }
  if (st==="more"){
    if (v==="more:done") return advance();
    const p = {}; PART_KEYS.forEach(k=>p[k]=S[k]); S.parts.push(p);
    Object.assign(S, blankPart()); S.step = steps().indexOf("thing"); persist(); return render();
  }
}
function goBack(){
  const st = cur();
  if (S.typing){ S.typing=false; return render(); }
  if (st==="detail" && S.amtWords && !S.pk.path.length && !S.pk.page){ S.amtWords=false; return render(); }
  if (st==="detail"){ S.num=null; S.numLog=null; }
  if (["thing","change","detail","holding","like"].includes(st)){
    if (S.pk.page){ S.pk.page--; return render(); }
    if (S.pk.path.length){ S.pk.path.pop(); return render(); }
    if (st==="like" && S.likeMode){ S.likeMode=null; return render(); }
    if (st==="thing" && S.parts.length){ Object.assign(S, S.parts.pop()); S.pk={path:[],page:0}; S.step=steps().indexOf("more"); return render(); }
  }
  if (S.step>0){ S.step--; S.pk={path:[],page:0}; render(); }
}

function wire(){
  const $ = id => document.getElementById(id);
  document.querySelectorAll(".tile[data-v]").forEach(b=>b.onclick=()=>pick(b.dataset.v));
  $("back") && ($("back").onclick=goBack);
  $("grown") && ($("grown").onclick=()=>{ drawer=!drawer; drawer?openDrawer():closeDrawer(); });
  $("next") && ($("next").onclick=advance);
  if ($("hname")){
    const inp=$("hname"), done=$("namedone");
    const finish=()=>{ const v=inp.value.trim(); if(!v) return; const nv=v.replace(/^./,c=>c.toUpperCase()); const val={l:nv, id:"named:"+nv, tp:"horse", trail:["Something in my mod","Horses","My yard horses"]}; if(JSON.stringify(S.thing)!==JSON.stringify(val)) clearAfter("thing"); S.thing=val; S.typing=false; advance(); };
    inp.oninput=()=>{ done.disabled=!inp.value.trim(); };
    inp.onkeydown=e=>{ if(e.key==="Enter") finish(); };
    done.onclick=finish;
    $("nameback").onclick=()=>{ S.typing=false; render(); };
  }
  $("shoton") && ($("shoton").onclick=()=>$("pickfile").click());
  $("pickfile") && ($("pickfile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; shrink(f).then(u=>{ S.shot=u; persist(); render(); }).catch(()=>{}); });
  $("shotoff") && ($("shotoff").onclick=()=>{S.shot=false;persist();render();});
  $("laurayes") && ($("laurayes").onclick=()=>{S.laura=true;persist();render();});
  $("laurano") && ($("laurano").onclick=()=>{S.laura=false;persist();render();});
  $("fix") && ($("fix").onclick=()=>{ S.step=steps().indexOf("review")-2; S.pk={path:[],page:0}; render(); });
  $("send") && ($("send").onclick=shareSheet);
  $("again") && ($("again").onclick=()=>{reset();render();});
  $("resend") && ($("resend").onclick=()=>{ S.step=steps().indexOf("review"); render(); });
  $("savedbtn") && ($("savedbtn").onclick=()=>{ showSaved=!showSaved; render(); });
  document.querySelectorAll("[data-resume]").forEach(b=>b.onclick=()=>{ const r=loadAll()[b.dataset.resume]; if(!r) return; S={...blankPart(), parts:[], ...r}; if(typeof S.step!=="number"||r.sent) S.step=steps().indexOf("review"); render(); });
  document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>numOp(b.dataset.op));
  $("numdone") && ($("numdone").onclick=numDone);
  $("words") && ($("words").onclick=()=>{ S.amtWords=true; S.pk={path:[],page:0}; render(); });
  $("puzzle") && ($("puzzle").onclick=()=>{ S.puz=makePuzzle(); render(); });
  $("puzno") && ($("puzno").onclick=()=>{ S.puz=null; render(); });
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ if(S.puz && S.puz.picked===null){ S.puz.picked=+b.dataset.ans; render(); } });
  $("newver") && ($("newver").onclick=()=>{ showRelease=!showRelease; render(); });
  $("getver") && ($("getver").onclick=()=>{ const r=newRelease(); setTimeout(()=>{ if(r){ setInstalled(r.version); showRelease=false; render(); } }, 1500); });
  $("gotver") && ($("gotver").onclick=()=>{ const r=newRelease(); if(r) setInstalled(r.version); showRelease=false; render(); });
  $("later") && ($("later").onclick=()=>{ clearTimeout(autoTimer); S.text=document.getElementById("msg")?.value ?? S.text; persist(); reset(); showSaved=true; render(); });
  document.querySelectorAll("[data-close]").forEach(el=>el.onclick=e=>{ if(e.target!==el) return; if(el.dataset.close==="saved") showSaved=false; else showRelease=false; render(); });
  document.querySelectorAll(".logo,.q h1").forEach(el=>{ let t=null; const go=()=>{ t=setTimeout(()=>{ drawer=!drawer; drawer?openDrawer():closeDrawer(); }, 1500); }; const stop=()=>clearTimeout(t);
    el.addEventListener("pointerdown",go); ["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,stop)); el.addEventListener("contextmenu",e=>e.preventDefault()); });
  if ($("msg")) wireEditor();
}

let autoTimer=null;
function refreshHistory(){ const l=document.getElementById("vlist"); if(l){ l.innerHTML=historyHTML(); wireRestore(); } const c=document.getElementById("vcount"); if(c) c.textContent=S.versions.length; const u=document.getElementById("undoall"); if(u) u.disabled = S.text===S.base; const pp=document.getElementById("pp"); if(pp) pp.textContent=prompt(); }
function setStatus(t){ const e=document.getElementById("status"); if(e) e.textContent = saveWarn ? statusText() : t; }
function wireRestore(){ document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{ S.text=S.versions[+b.dataset.restore].text; addVersion("restored"); const ta=document.getElementById("msg"); ta.value=S.text; ta.dispatchEvent(new Event("fit")); refreshHistory(); setStatus("Went back · saved "+clock(Date.now())); }); }
function wireEditor(){
  const ta=document.getElementById("msg");
  const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+4+"px"; }; fit(); ta.addEventListener("fit",fit);
  ta.oninput=()=>{ S.text=ta.value; fit(); setStatus("Changing…"); persistLater(); refreshHistory(); };
  function persistLater(){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(addVersion("auto")) setStatus("Auto-saved "+clock(Date.now())); else setStatus("Saved"); refreshHistory(); },1500); }
  document.getElementById("save").onclick=()=>{ clearTimeout(autoTimer); S.text=ta.value; const last=S.versions[S.versions.length-1]; if(last && last.text===S.text){ if(last.kind!=="start") last.kind="saved"; persist(); } else addVersion("saved"); setStatus("Saved "+clock(Date.now())); refreshHistory(); };
  document.getElementById("undoall").onclick=()=>{ clearTimeout(autoTimer); S.text=S.base; ta.value=S.text; fit(); addVersion("undo"); setStatus("Back to the start · saved"); refreshHistory(); };
  document.getElementById("hist").ontoggle=e=>{ S.histOpen=e.target.open; };
  wireRestore();
}
function shrink(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onerror=bad; r.onload=()=>{ const im=new Image(); im.onerror=bad; im.onload=()=>{ const k=Math.min(1,1200/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",.8)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
function openDrawer(){
  let d = document.getElementById("drawer");
  if (!d){ d = document.createElement("aside"); d.id="drawer"; d.className="drawer"; document.body.appendChild(d); }
  d.innerHTML = `<h3>What Claude will get <button class="x" id="dx" aria-label="Close">${IC.x}</button></h3>
    <p>Harry only edits his own words. Everything under them is added when he sends, and he can't change it.</p>
    <pre id="pp">${esc(prompt())}</pre><button class="copy" id="cp">Copy the message</button>`;
  document.getElementById("dx").onclick=()=>{drawer=false;closeDrawer();};
  document.getElementById("cp").onclick=e=>copy(e.target);
}
function closeDrawer(){ document.getElementById("drawer")?.remove(); }
function copy(btn){
  const t = prompt();

/* ---------- Maths, woven in. Never a gate: every maths bit can be skipped and nothing is marked wrong. ---------- */
const TIMESW = {"Bigger":"times bigger","Smaller":"times smaller","Faster":"times faster","Slower":"times slower","Jumps higher":"times higher","Louder":"times louder","Quieter":"times quieter","Easier to see":"times easier to see","Happens more often":"times as often","Happens less often":"times less often","Lasts longer":"times as long","Wears out slower":"times slower to wear out","Gives more coins or XP":"times as many coins or XP"};
const numMode = c => ["More of them","Fewer of them"].includes(c.l) ? "count" : c.l==="Cheaper" ? "coins" : "times";
const fmt = n => Number.isInteger(n) ? String(n) : Math.floor(n) ? `${Math.floor(n)}½` : "½";
const sym = n => Number.isInteger(n) ? String(n) : String(n).replace(".5",".5");
const NUM_START = {times:2, count:1, coins:10};
const NUM_OPS = {
  times:[["+1","Add 1",n=>n+1,"+"],["-1","Take 1 away",n=>n-1,"−"],["x2","Double it",n=>n*2,"×"],["x10","Times 10",n=>n*10,"×"],["h","Half it",n=>n/2,"÷"]],
  count:[["+1","Add 1",n=>n+1,"+"],["+10","Add 10",n=>n+10,"+"],["+64","Add a stack (64)",n=>n+64,"+"],["-1","Take 1 away",n=>n-1,"−"],["x2","Double it",n=>n*2,"×"],["h","Half it",n=>n/2,"÷"]],
  coins:[["+1","Add 1 coin",n=>n+1,"+"],["+5","Add 5",n=>n+5,"+"],["+10","Add 10",n=>n+10,"+"],["-1","Take 1 away",n=>n-1,"−"],["x2","Double it",n=>n*2,"×"],["h","Half it",n=>n/2,"÷"]]
};
const OPN = {"+1":1,"-1":1,"+10":10,"+64":64,"+5":5,"x2":2,"x10":10,"h":2};
function numLabel(c, n){
  const m = numMode(c);
  if (m==="count") return c.l==="Fewer of them" ? `only ${fmt(n)} of them` : `${fmt(n)} of them`;
  if (m==="coins") return `costs ${fmt(n)} coins`;
  return `${fmt(n)} ${TIMESW[c.l]||"times as much"}`;
}
function blocksHTML(m, n){
  if (m==="count"){
    const st = Math.floor(n/64), rest = Math.round(n - st*64);
    const stacks = Array.from({length:Math.min(st,12)},()=>`<span class="stack">64</span>`).join("") + (st>12?`<span class="stackmore">+${st-12} more stacks</span>`:"");
    const small = rest ? `<span class="eights">${Array.from({length:Math.ceil(rest/8)},(_,r)=>`<span class="row8">${"<i></i>".repeat(Math.min(8,rest-r*8))}</span>`).join("")}</span>` : "";
    const say = st ? `That's ${st} stack${st>1?"s":""} of 64${rest?` and ${rest} more`:""}.` : n>=8 ? `That's ${Math.floor(n/8)} row${n>=16?"s":""} of 8${n%8?` and ${fmt(n%8)} more`:""}.` : "";
    return `<div class="blocks">${stacks}${small}</div>${say?`<p class="numsay">${say}</p>`:""}`;
  }
  if (m==="coins"){
    const tens = Math.floor(n/10), ones = n - tens*10;
    const bag = Array.from({length:Math.min(tens,20)},()=>`<span class="coinbag">10</span>`).join("") + (tens>20?`<span class="stackmore">+${tens-20} more bags</span>`:"");
    return `<div class="blocks">${bag}${"<b class='c1'></b>".repeat(Math.floor(ones))}${ones%1?"<b class='c1 half'></b>":""}</div>${tens?`<p class="numsay">That's ${tens} bag${tens>1?"s":""} of 10${ones?` and ${fmt(ones)} more`:""}.</p>`:""}`;
  }
  const shown = Math.min(Math.floor(n), 40);
  return `<div class="blocks timesrow"><span class="one">1</span><span class="arrow">→</span>${Array.from({length:shown},()=>"<i></i>").join("")}${n%1?"<i class='half'></i>":""}${n>40?`<span class="stackmore">and ${fmt(n-40)} more</span>`:""}</div>`;
}
function numberScreen(){
  const c = S.change, m = numMode(c);
  if (typeof S.num !== "number") S.num = S.detail?.num ?? NUM_START[m];
  const n = S.num;
  const q = m==="count" ? (c.l==="Fewer of them" ? "How many should there be?" : "How many should there be?") : m==="coins" ? "How many coins should it cost?" : `How many times ${lc((TIMESW[c.l]||"times more").replace("times ",""))}?`;
  const body = `<div class="numbox panel">
      <div class="bignum" aria-live="polite">${fmt(n)}</div>
      <div class="sumline">${S.numLog ? esc(S.numLog) : "Tap the buttons to build your number"}</div>
      ${blocksHTML(m, n)}
      <p class="numwhat">${esc(cap(subj()))}: ${esc(numLabel(c, n))}</p>
    </div>
    <div class="grid ops">${NUM_OPS[m].map(([k,l,f])=>{ const r=f(n); const off = r<1 || r>9999 || (k==="h" && (n%1 || (m!=="times" && n%2))); return `<button class="tile op" data-op="${k}" ${off?"disabled":""}>${esc(l)}</button>`; }).join("")}</div>
    <div class="btns"><button class="go quiet" id="words">Use words instead</button><button class="go" id="numdone">That's my number</button></div>`;
  return {q, body};
}
function numOp(k){
  const m = numMode(S.change), op = NUM_OPS[m].find(o=>o[0]===k); if (!op) return;
  const a = S.num, r = op[2](a); if (r<1 || r>9999) return;
  S.numLog = `${sym(a)} ${op[3]} ${OPN[k]} = ${sym(r)}`;
  if (k==="h" && r%1) S.numLog += `  (that's ${fmt(r)})`;
  S.num = r; render();
}
function numDone(){
  const c = S.change, n = S.num, m = numMode(c);
  const val = {l:numLabel(c,n), id:`number:${m}:${n}`, num:n, unit:m};
  if (JSON.stringify(S.detail)!==JSON.stringify(val)) clearAfter("detail");
  S.detail = val; S.num = null; S.numLog = null; advance();
}

/* A puzzle about his report, offered after sending. Optional, no score, no streaks, no "wrong". */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function makePuzzle(){
  const t = S.thing && !S.thing.vague ? S.thing.l : null;
  const horse = t && S.thing.tp==="horse" ? t : HORSE_NAMES[rnd(0,HORSE_NAMES.length-1)];
  const d = S.detail?.num && S.detail.unit==="times" && Number.isInteger(S.detail.num) && S.detail.num<=12 ? S.detail : null;
  const P = [
    () => { const a=rnd(3,9), b=rnd(2,6); return {q:`The yard has ${b} rows of stalls with ${a} stalls in each row. How many stalls is that?`, a:a*b, w:`${b} × ${a} = ${a*b}`}; },
    () => { const k=rnd(1,3), e=rnd(0,9); return {q:`You've got ${k} stack${k>1?"s":""} of hay bales and ${e} more. A stack is 64. How many hay bales?`, a:64*k+e, w:`${k} × 64${e?` + ${e}`:""} = ${64*k+e}`}; },
    () => { const a=rnd(2,8)*2; return {q:`${horse} and Molly May share ${a} carrots equally. How many does ${horse} get?`, a:a/2, w:`${a} ÷ 2 = ${a/2}`}; },
    () => { const h=rnd(3,9); return {q:`${h} horses go to a show. Each horse needs 4 horseshoes. How many horseshoes?`, a:h*4, w:`${h} × 4 = ${h*4}`}; },
    () => { const c=rnd(20,60), s=rnd(5,19); return {q:`You have ${c} coins. ${t&&!S.thing.isNew?`${t} costs`:"A new saddle costs"} ${s} coins. How many coins are left?`, a:c-s, w:`${c} − ${s} = ${c-s}`}; },
    () => { const a=rnd(6,15), b=rnd(5,15); return {q:`${horse} jumped ${a} fences in the morning and ${b} in the afternoon. How many fences altogether?`, a:a+b, w:`${a} + ${b} = ${a+b}`}; },
    () => { const s=rnd(9,12), k=rnd(1,3); const e=s+k>12?s+k-12:s+k; return {q:`A show starts at ${s} o'clock and lasts ${k} hour${k>1?"s":""}. What time does it finish?`, a:e, w:`${s} o'clock + ${k} hour${k>1?"s":""} = ${e} o'clock`, unit:" o'clock"}; },
    () => { return {q:`There are ${HORSE_NAMES.length} horses at the yard. Each one has 4 legs. How many legs is that?`, a:HORSE_NAMES.length*4, w:`${HORSE_NAMES.length} × 4 = ${HORSE_NAMES.length*4}`}; }
  ];
  if (d) P.push(() => { const b=rnd(2,9); return {q:`You asked for ${lc(S.change.l)}: ${d.num} ${TIMESW[S.change.l]||"times"}. If it was ${b} before, what would it be now?`, a:b*d.num, w:`${b} × ${d.num} = ${b*d.num}`}; });
  const p = (d && Math.random()<.5) ? P[P.length-1]() : P[rnd(0,P.length-1)]();
  const opts = new Set([p.a]); const near = [p.a+1,p.a-1,p.a+2,p.a+10,p.a-10,p.a*2,p.a+4,p.a-4].filter(x=>x>0 && x!==p.a && (!p.unit || x<=12));
  while (opts.size<3 && near.length) opts.add(near.splice(rnd(0,near.length-1),1)[0]);
  p.opts = [...opts].sort((x,y)=>x-y); p.unit = p.unit||""; p.picked = null; return p;
}
function puzzleHTML(){
  const p = S.puz;
  if (!p) return `<button class="go quiet" id="puzzle">A puzzle about your report</button>`;
  return `<div class="panel puz"><h2>Puzzle</h2><p class="puzq">${esc(p.q)}</p>
    <div class="grid puzopts">${p.opts.map(o=>`<button class="tile mm ${p.picked!==null && o===p.a ? "right" : p.picked===o ? "sel" : ""}" data-ans="${o}" ${p.picked!==null?"disabled":""}>${o}${esc(p.unit)}</button>`).join("")}</div>
    ${p.picked!==null ? `<p class="puzres">${p.picked===p.a?"Yes!":`It's ${p.a}${esc(p.unit)}.`} ${esc(p.w)}</p>
    <div class="btns"><button class="go quiet small" id="puzno">That's enough</button><button class="go small" id="puzzle">Another puzzle</button></div>` : `<button class="go quiet small" id="puzno">Not now</button>`}</div>`;
}
function statsHTML(all){
  const sent = all.filter(r=>r.sent); if (!sent.length) return "";
  const by = k => sent.filter(r=>r.kind===k).length;
  const rows = Object.entries(KINDS).map(([k,v])=>[k,v.label,by(k)]).filter(r=>r[2]);
  return `<div class="stats"><div class="listlabel">You've sent ${sent.length} report${sent.length>1?"s":""}</div>${rows.map(([k,l,n])=>`<div class="srow"><span class="slab">${esc(l)}</span><span class="sbar">${`<i class="k-${k}"></i>`.repeat(Math.min(n,20))}</span><b>${n}</b></div>`).join("")}</div>`;
}

/* ---------- New versions: releases.json on the same site, written by the add-on thread on every release ---------- */
var REL = null, showRelease = false;
const INSTALLED = "hbt_installed_version";
function installedVersion(){ try { return localStorage.getItem(INSTALLED) || ""; } catch(e){ return ""; } }
function setInstalled(v){ try { localStorage.setItem(INSTALLED, v); } catch(e){} }
function versionText(){
  const iv = installedVersion(), latest = REL?.latest;
  if (iv) return `${iv} (installed from the app)`;
  if (S.version && S.version!=="?") return `${S.version} (Harry read it off the Horse Guide)`;
  return `unknown${latest?`, latest released is ${latest}`:""} (ask Harry to check the Horse Guide front page)`;
}
function newRelease(){ const l = REL?.releases?.[0]; return l && l.version !== installedVersion() ? l : null; }
function fixedIn(code){ for (const r of (REL?.releases||[])) if ((r.fixed||[]).includes(code)) return r.version; return null; }
function statusOf(code){ for (const r of (REL?.releases||[])) if (r.status && r.status[code]) return r.status[code]; return null; }
function loadReleases(){
  if (!/^https?:/.test(location.protocol)) return;
  fetch("releases.json", {cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if (j && Array.isArray(j.releases)){ REL=j; if (S.step===0 || S.step==="done") render(); } }).catch(()=>{});
}
function latestRelease(){ return REL?.releases?.[0] || null; }
function releaseTile(){
  const r = latestRelease(); if (!r) return "";
  return newRelease()
    ? `<button class="tile mm primary newver" id="newver">New version ${esc(r.version)} is ready!</button>`
    : `<button class="tile mm latestver" id="newver">Latest version ${esc(r.version)}</button>`;
}
function releasePanel(){
  const r = latestRelease(); if (!r || !showRelease) return "";
  const isNew = !!newRelease();
  const notes = (r.notes_for_harry||[]).map(n=>`<li>${esc(n)}</li>`).join("");
  return `<div class="homeover" data-close="rel"><div class="inner savedlist relpanel"><div class="listlabel">${isNew?"What's new in":"You've got"} ${esc(r.version)}</div>${notes?`<ul class="relnotes">${notes}</ul>`:""}
    <a class="tile mm primary" id="getver" href="${esc(r.file)}" download style="text-decoration:none">${isNew?"Download it":"Download it again"}</a>
    <p class="relhow">When it has downloaded, tap it and choose Minecraft. Your world and horses stay safe.</p>
    ${isNew?`<button class="tile mm" id="gotver">I've got it now</button>`:""}<button class="tile mm closeover" data-close="rel">Close</button></div></div>`;
}
function reportState(r){
  if (!r.sent) return ["draft","Not sent yet. Tap to finish"];
  if (fixedIn(code(r))) return ["fixed",`Fixed in ${fixedIn(code(r))}!`];
  const st = statusOf(code(r)); if (st) return ["wip", st];
  return ["sent","Sent to Daddy"];
}
function reportTag(r){
  if (!r.sent) return "";
  const f = fixedIn(code(r)); if (f) return `<span class="fixtag">Fixed in ${esc(f)}</span>`;
  const st = statusOf(code(r)); return st ? `<span class="fixtag wip">${esc(st)}</span>` : "";
}
function builderNotes(){
  const N = [];
  if (S.kind === "broken"){
    if (S.thing?.vague) N.push("Harry wasn't sure what it was about: use the screenshot and his sentence, otherwise ask Phill.");
    if (!installedVersion() && (!S.version || S.version==="?")) N.push("Version unknown: assume the latest release, and say so in the reply.");
    if (S.words==="Yes, words came up" && !S.shot) N.push("Words came up on screen but there is no screenshot: the exact text may be in Harry's sentence. If not, ask Phill to get it.");
    if (S.doing==="Don't know" || S.tapped==="Don't know") N.push("Steps are partly unknown: try the obvious routes on the test server first.");
    const w = BROKEN.find(b=>b.id===S.what); if (w) N.push(`Done when: following the same steps${S.laura?" in a LAN game":""}, ${w.exp}${S.thing&&!S.thing.vague?` (${S.thing.l})`:""}. Add a check to the per-item test.`);
  } else {
    [...S.parts, S].forEach((p,i)=>{
      if (!p.change) return;
      const who = p.thing?.vague ? "the thing Harry means" : subj(p), tag = S.parts.length ? `Part ${i+1}: ` : "";
      if (p.thing?.vague) N.push(`${tag}Harry wasn't sure what it's about: ask Phill which thing he means.`);
      if (p.change?.vague) N.push(`${tag}Harry picked "Something else": his sentence may say more, otherwise ask Phill.`);
      if (p.thing?.isNew && !p.like) N.push(`${tag}Brand new, not like anything existing: propose a look and check it with Phill before building.`);
      if (p.thing?.isNew && !p.where) N.push(`${tag}No place chosen for the new thing: suggest the Horse Guide shop as a default.`);
      if (p.detail?.unit==="times") N.push(`${tag}Number: multiply the current value by ${p.detail.num} (find the current value in the add-on code; cap it if the game would break).`);
      if (p.detail?.unit==="count") N.push(`${tag}Number: Harry wants exactly ${p.detail.num}.`);
      if (p.detail?.unit==="coins") N.push(`${tag}Number: the price should be ${p.detail.num} coins.`);
      if (p.detail && !p.detail.num && /^amount:/.test(p.detail.id||"")) N.push(`${tag}Amount is a word ("${p.detail.l}"): choose a sensible value and say what you picked.`);
      N.push(`${tag}Done when: ${partSentence(p).replace(/\.$/,"")}${p.when&&p.when!=="All the time"?"":" (all the time)"}. Harry should never need to type a command for it.`);
    });
  }
  return N;
}

/* ---------- Real send: the iPad's own share sheet (replaces the mockup sheet above) ---------- */
function dataURLtoFile(u, name){
  const [h, b] = u.split(","), mime = h.match(/:(.*?);/)[1], bin = atob(b), arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, {type:mime});
}
function markSent(){ S.sent = Date.now(); persist(); S.step = "done"; render(); }
/* Daddy's inbox: a Google Apps Script web app that emails the report to Phill's Gmail, labelled. Empty = use the share sheet. */
const SEND_URL = "https://script.google.com/macros/s/AKfycbwBffMumMoI-XmtIphJ2w4hcSFcgP6zrOc9TzRPrSQg3a-u8lhRPNHlHnoeg_JyU23K/exec";
const SEND_KEY = "hbt-7Qm2xR9vK4";
async function sendToInbox(text){
  const btn = document.getElementById("send"); if (btn){ btn.disabled = true; btn.textContent = "Sending…"; }
  try {
    const res = await fetch(SEND_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({key:SEND_KEY, code:code(), kind:S.kind, said:S.text, text, shot:S.shot||null})});
    const j = await res.json();
    if (j.ok) return true;
  } catch(e){}
  if (btn){ btn.disabled = false; btn.textContent = "Send to Daddy"; }
  return false;
}
async function shareSheet(){
  clearTimeout(autoTimer); S.text = document.getElementById("msg")?.value ?? S.text; persist();
  const text = prompt();
  if (SEND_URL){
    if (navigator.onLine !== false && await sendToInbox(text)){ S.via = "inbox"; markSent(); return; }
    S.sendFailed = true;
  }
  if (navigator.share){
    const data = {text};
    if (S.shot){
      try { const f = dataURLtoFile(S.shot, `${code()}.jpg`); if (navigator.canShare && navigator.canShare({files:[f]})) data.files = [f]; } catch(e){}
    }
    try { await navigator.share(data); markSent(); return; }
    catch(e){ if (e && e.name === "AbortError") return; /* closed without sending: stays in "Not sent yet" */ }
  }
  fallbackSend(text);
}
function fallbackSend(text){
  const L = document.getElementById("layer");
  let copied = false;
  try { navigator.clipboard.writeText(text).then(()=>{ copied = true; const s=document.getElementById("cpstate"); if(s) s.textContent="Copied. "; }).catch(()=>{}); } catch(e){}
  L.innerHTML = `<div class="scrim" id="scrim" style="align-items:center;padding:16px"><div class="panel" style="max-width:560px;width:100%">
    <h2>Send it to Daddy</h2>${S.sendFailed?`<p style="margin:0">It couldn’t reach Daddy’s email just now, so send it by Messages instead.</p>`:""}
    <p style="margin:0"><span id="cpstate"></span>Open Messages, pick Daddy, and paste it in.</p>
    <div class="btns"><a class="go small" style="text-decoration:none" id="sms" href="sms:&body=${encodeURIComponent(text)}">Open Messages</a></div>
    <div class="btns"><button class="go quiet small" id="notyet">Not yet</button><button class="go small" id="didsend">I sent it</button></div>
  </div></div>`;
  document.getElementById("notyet").onclick = () => { L.innerHTML = ""; };
  document.getElementById("didsend").onclick = () => { L.innerHTML = ""; markSent(); };
}
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
